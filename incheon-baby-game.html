<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>인천 아이 키우기 🍼</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&family=Gaegu:wght@400;700&display=swap');

  :root {
    --primary: #FF6B9D;
    --secondary: #FFB830;
    --accent: #4ECDC4;
    --soft-pink: #FFE4F0;
    --soft-yellow: #FFF8E7;
    --soft-mint: #E8FAF8;
    --text: #333;
    --white: #fff;
    --shadow: 0 4px 20px rgba(0,0,0,0.12);
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Nanum Gothic', sans-serif;
    background: linear-gradient(135deg, #FFE4F0 0%, #FFF8E7 50%, #E8FAF8 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .game-wrap {
    width: 100%;
    max-width: 420px;
    min-height: 600px;
    background: white;
    border-radius: 32px;
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
  }

  /* ── 헤더 ── */
  .header {
    background: linear-gradient(135deg, var(--primary), #FF8FB1);
    padding: 20px;
    text-align: center;
    color: white;
  }
  .header h1 { font-family: 'Gaegu', cursive; font-size: 24px; font-weight: 700; }
  .header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }

  /* ── HHP 바 ── */
  .hhp-bar-wrap { padding: 16px 20px 8px; }
  .hhp-label { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-bottom: 6px; }
  .hhp-label span:last-child { font-weight: 700; color: var(--primary); }
  .hhp-bar { height: 12px; background: #F0F0F0; border-radius: 99px; overflow: hidden; }
  .hhp-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 99px; transition: width 0.5s ease; }

  /* ── 스크린 ── */
  .screen { display: none; padding: 20px; }
  .screen.active { display: block; }

  /* ── 시작 화면 ── */
  .baby-emoji { font-size: 80px; text-align: center; margin: 20px 0; animation: bounce 2s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  .start-title { text-align: center; font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
  .start-desc { text-align: center; font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 24px; }

  .input-wrap { margin-bottom: 16px; }
  .input-label { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 8px; display: block; }
  .text-input {
    width: 100%; padding: 12px 16px; border: 2px solid #EEE; border-radius: 12px;
    font-family: 'Nanum Gothic', sans-serif; font-size: 15px; outline: none;
    transition: border-color 0.2s;
  }
  .text-input:focus { border-color: var(--primary); }

  /* ── 월령 선택 ── */
  .age-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .age-btn {
    padding: 14px 10px; border: 2px solid #EEE; border-radius: 16px; background: white;
    cursor: pointer; text-align: center; transition: all 0.2s; font-family: 'Nanum Gothic', sans-serif;
  }
  .age-btn:hover, .age-btn.selected { border-color: var(--primary); background: var(--soft-pink); }
  .age-btn .emoji { font-size: 28px; display: block; margin-bottom: 4px; }
  .age-btn .label { font-size: 13px; font-weight: 700; color: #333; }

  /* ── 버튼 ── */
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 14px; font-family: 'Nanum Gothic', sans-serif;
    font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; margin-top: 12px;
  }
  .btn-primary { background: linear-gradient(135deg, var(--primary), #FF8FB1); color: white; }
  .btn-primary:active { transform: scale(0.97); }
  .btn-secondary { background: #F5F5F5; color: #333; }
  .btn-accent { background: linear-gradient(135deg, var(--accent), #6FD8D2); color: white; }

  /* ── 미션 카드 ── */
  .mission-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .mission-step { font-size: 13px; color: #999; }
  .mission-count { font-size: 13px; font-weight: 700; color: var(--primary); }

  .mission-card {
    background: linear-gradient(135deg, #FFF5F8, white);
    border: 2px solid #FFE4F0;
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .mission-emoji { font-size: 52px; margin-bottom: 12px; }
  .mission-title { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
  .mission-desc { font-size: 14px; color: #666; line-height: 1.6; }

  /* ── 미니게임 ── */
  .minigame-area { text-align: center; padding: 16px 0; }
  .progress-circle {
    width: 100px; height: 100px; border-radius: 50%; border: 6px solid #EEE;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 800; color: var(--primary); margin: 0 auto 16px;
    position: relative; background: white; box-shadow: var(--shadow);
    transition: all 0.2s;
  }
  .progress-circle.pop { animation: pop 0.3s ease; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

  .tap-btn {
    padding: 16px 40px; border: none; border-radius: 99px; background: linear-gradient(135deg, var(--primary), #FF8FB1);
    color: white; font-family: 'Nanum Gothic', sans-serif; font-size: 17px; font-weight: 700;
    cursor: pointer; transition: all 0.15s; box-shadow: 0 4px 12px rgba(255,107,157,0.4);
  }
  .tap-btn:active { transform: scale(0.95); box-shadow: none; }

  /* ── 퀴즈 ── */
  .quiz-question { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 16px; text-align: center; line-height: 1.5; }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .quiz-option {
    padding: 14px 16px; border: 2px solid #EEE; border-radius: 12px; background: white;
    cursor: pointer; font-family: 'Nanum Gothic', sans-serif; font-size: 14px; font-weight: 700;
    text-align: center; transition: all 0.2s;
  }
  .quiz-option:hover { border-color: var(--primary); background: var(--soft-pink); }
  .quiz-option.correct { border-color: #2ECC71; background: #E8FFF0; color: #2ECC71; }
  .quiz-option.wrong { border-color: #E74C3C; background: #FFF0F0; color: #E74C3C; }

  /* ── 보상 팝업 ── */
  .reward-popup {
    background: linear-gradient(135deg, #FFF5F8, #FFF8E7);
    border: 2px solid var(--secondary);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    margin-top: 16px;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .reward-emoji { font-size: 40px; margin-bottom: 8px; }
  .reward-hhp { font-size: 22px; font-weight: 800; color: var(--secondary); margin-bottom: 8px; }
  .reward-msg { font-size: 13px; color: #666; line-height: 1.5; }

  /* ── 완료 화면 ── */
  .complete-emoji { font-size: 80px; text-align: center; margin: 20px 0; }
  .complete-title { text-align: center; font-size: 22px; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
  .complete-desc { text-align: center; font-size: 14px; color: #666; line-height: 1.7; margin-bottom: 24px; }
  .channel-card {
    background: linear-gradient(135deg, #FAE100, #FFD000);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
  }
  .channel-card .kakao-logo { font-size: 36px; margin-bottom: 8px; }
  .channel-card p { font-size: 14px; font-weight: 700; color: #333; }
  .channel-card .channel-name { font-size: 18px; font-weight: 800; color: #333; margin-top: 4px; }

  .feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .feature-item {
    background: white; border: 2px solid #EEE; border-radius: 14px;
    padding: 14px 10px; text-align: center;
  }
  .feature-item .f-emoji { font-size: 28px; margin-bottom: 6px; }
  .feature-item .f-label { font-size: 12px; font-weight: 700; color: #555; }

  /* ── 파티클 ── */
  .confetti-wrap { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
  .confetti { position: absolute; width: 10px; height: 10px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="game-wrap">
  <!-- 헤더 -->
  <div class="header">
    <h1>🍼 인천 아이 키우기</h1>
    <p>AI 인천육아코디 챗봇 홍보 게임</p>
  </div>

  <!-- HHP 바 -->
  <div class="hhp-bar-wrap">
    <div class="hhp-label">
      <span>💛 행복지수 (HHP)</span>
      <span id="hhp-text">0 / 100</span>
    </div>
    <div class="hhp-bar">
      <div class="hhp-fill" id="hhp-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- ① 시작 화면 -->
  <div class="screen active" id="screen-start">
    <div class="baby-emoji">👶</div>
    <div class="start-title">우리 아이와 함께해요!</div>
    <div class="start-desc">인천시 AI 육아 챗봇을 체험하며<br>아이의 성장을 도와주세요 💕</div>
    <div class="input-wrap">
      <label class="input-label">아이 이름</label>
      <input class="text-input" id="baby-name-input" placeholder="예) 인천이" maxlength="10">
    </div>
    <button class="btn btn-primary" onclick="goToAge()">다음 →</button>
  </div>

  <!-- ② 월령 선택 -->
  <div class="screen" id="screen-age">
    <div class="start-title" style="margin-bottom:8px">몇 개월이에요?</div>
    <div class="start-desc" style="margin-bottom:16px">아이 월령에 맞는 미션이 등장해요!</div>
    <div class="age-grid">
      <div class="age-btn" onclick="selectAge(0)">
        <span class="emoji">🥚</span>
        <span class="label">0~2개월</span>
      </div>
      <div class="age-btn" onclick="selectAge(1)">
        <span class="emoji">🌼</span>
        <span class="label">3~5개월</span>
      </div>
      <div class="age-btn" onclick="selectAge(2)">
        <span class="emoji">🌿</span>
        <span class="label">6~11개월</span>
      </div>
      <div class="age-btn" onclick="selectAge(3)">
        <span class="emoji">🐣</span>
        <span class="label">12~23개월</span>
      </div>
      <div class="age-btn" style="grid-column:1/-1" onclick="selectAge(4)">
        <span class="emoji">🐥</span>
        <span class="label">24~36개월</span>
      </div>
    </div>
    <button class="btn btn-primary" onclick="startGame()" style="margin-top:16px">시작하기 🎮</button>
  </div>

  <!-- ③ 미션 화면 -->
  <div class="screen" id="screen-mission">
    <div class="mission-header">
      <span class="mission-step" id="mission-step">미션 1/3</span>
      <span class="mission-count" id="mission-baby-name"></span>
    </div>
    <div class="mission-card">
      <div class="mission-emoji" id="m-emoji"></div>
      <div class="mission-title" id="m-title"></div>
      <div class="mission-desc" id="m-desc"></div>
    </div>
    <div id="mission-content"></div>
  </div>

  <!-- ④ 완료 화면 -->
  <div class="screen" id="screen-complete">
    <div class="complete-emoji">🎉</div>
    <div class="complete-title" id="complete-title">미션 완료!</div>
    <div class="complete-desc" id="complete-desc"></div>
    <div class="channel-card">
      <div class="kakao-logo">💬</div>
      <p>카카오톡에서 지금 만나보세요!</p>
      <div class="channel-name">AI 인천육아코디</div>
    </div>
    <div class="feature-grid">
      <div class="feature-item">
        <div class="f-emoji">🤖</div>
        <div class="f-label">AI 육아상담</div>
      </div>
      <div class="feature-item">
        <div class="f-emoji">🔔</div>
        <div class="f-label">맞춤 알림톡</div>
      </div>
      <div class="feature-item">
        <div class="f-emoji">💰</div>
        <div class="f-label">지원금 안내</div>
      </div>
      <div class="feature-item">
        <div class="f-emoji">📈</div>
        <div class="f-label">성장기록</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="restart()">다시 하기 🔄</button>
  </div>
</div>

<div class="confetti-wrap" id="confetti-wrap"></div>

// ── 상태 ──────────────────────────────────────────────

let ageGroup = -1;
let hhp = 0;
let missionIdx = 0;

let tapCount = 0;
let quizDone = false;

// ── 화면 전환 ──────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function updateHHP(val) {
  hhp = Math.min(100, hhp + val);
  document.getElementById('hhp-text').textContent = `${hhp} / 100`;
  document.getElementById('hhp-fill').style.width = hhp + '%';
}

// ── 시작 ──────────────────────────────────────────────
function goToAge() {
  const input = document.getElementById('baby-name-input').value.trim();
  if (!input) { alert('아이 이름을 입력해주세요!'); return; }
  babyName = input;
  showScreen('screen-age');
}

function selectAge(idx) {
  ageGroup = idx;
  document.querySelectorAll('.age-btn').forEach((b,i) => {
    b.classList.toggle('selected', i === idx);
  });
}

function startGame() {
  if (ageGroup < 0) { alert('월령을 선택해주세요!'); return; }
  missions = MISSIONS[ageGroup];
  missionIdx = 0;
  showScreen('screen-mission');
  renderMission();
}

// ── 미션 렌더링 ──────────────────────────────────────────
function renderMission() {
  const m = missions[missionIdx];
  document.getElementById('mission-step').textContent = `미션 ${missionIdx+1}/3`;
  document.getElementById('mission-baby-name').textContent = `${babyName} 💕`;
  document.getElementById('m-emoji').textContent = m.emoji;
  document.getElementById('m-title').textContent = m.title;
  document.getElementById('m-desc').textContent = m.desc;

  const area = document.getElementById('mission-content');
  area.innerHTML = '';

  if (m.type === 'minigame') renderMinigame(m, area);
  else renderQuiz(m, area);
}

function renderMinigame(m, area) {
  tapCount = 0;
  area.innerHTML = `
    <div class="minigame-area">
      <div class="progress-circle" id="prog-circle">0/${m.goal}</div>
      <button class="tap-btn" onclick="tap()">👆 ${m.action}</button>
    </div>
  `;
}

function tap() {
  const m = missions[missionIdx];
  tapCount++;
  const circle = document.getElementById('prog-circle');
  circle.textContent = `${tapCount}/${m.goal}`;
  circle.classList.remove('pop');
  void circle.offsetWidth;
  circle.classList.add('pop');

  if (tapCount >= m.goal) {
    document.querySelector('.tap-btn').disabled = true;
    showReward(m);
  }
}

function renderQuiz(m, area) {
  quizDone = false;
  area.innerHTML = `
    <div class="quiz-question">${m.question}</div>
    <div class="quiz-options">
      ${m.options.map((o,i) => `<button class="quiz-option" onclick="answerQuiz(${i})" id="opt-${i}">
        ${['①','②','③'][i]} ${o}
      </button>`).join('')}
    </div>
  `;
}

function answerQuiz(idx) {
  if (quizDone) return;
  quizDone = true;
  const m = missions[missionIdx];
  document.querySelectorAll('.quiz-option').forEach((b,i) => {
    b.disabled = true;
    if (i === m.answer) b.classList.add('correct');
    else if (i === idx) b.classList.add('wrong');
  });
  showReward(m);
}

function showReward(m) {
  updateHHP(m.reward);
  const area = document.getElementById('mission-content');
  const rewardDiv = document.createElement('div');
  rewardDiv.className = 'reward-popup';
  rewardDiv.innerHTML = `
    <div class="reward-emoji">🌟</div>
    <div class="reward-hhp">+${m.reward} HHP!</div>
    <div class="reward-msg">${m.rewardMsg}</div>
    <button class="btn btn-primary" onclick="nextMission()" style="margin-top:12px">
      ${missionIdx < 2 ? '다음 미션 →' : '🎉 완료!'}
    </button>
  `;
  area.appendChild(rewardDiv);
}

function nextMission() {
  missionIdx++;
  if (missionIdx >= 3) {
    showComplete();
  } else {
    renderMission();
  }
}

// ── 완료 ──────────────────────────────────────────────
function showComplete() {
  launchConfetti();
  document.getElementById('complete-title').textContent = `${babyName} 성장 완료! 🎊`;
  document.getElementById('complete-desc').textContent =
    `HHP ${hhp}점을 모았어요!\nAI 인천육아코디 챗봇으로\n실제 육아 정보를 받아보세요 💕`;
  showScreen('screen-complete');
}

function restart() {
  babyName = ""; ageGroup = -1; hhp = 0; missionIdx = 0;
  updateHHP(0); hhp = 0;
  document.getElementById('hhp-fill').style.width = '0%';
  document.getElementById('hhp-text').textContent = '0 / 100';
  document.getElementById('baby-name-input').value = '';
  document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('selected'));
  showScreen('screen-start');
}

// ── 폭죽 ──────────────────────────────────────────────
function launchConfetti() {
  const wrap = document.getElementById('confetti-wrap');
  wrap.innerHTML = '';
  const colors = ['#FF6B9D','#FFB830','#4ECDC4','#95E1D3','#F8B500'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.cssText = `
      left:${Math.random()*100}%;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*0.5}s;
    `;
    wrap.appendChild(c);
  }
  setTimeout(() => wrap.innerHTML = '', 4000);
}
</script>
</body>
